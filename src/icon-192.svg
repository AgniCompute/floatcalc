<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich deep background gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="100%" stop-color="#0c1017"/>
    </linearGradient>

    <!-- Vibrant amber accent gradient for active equals/float badge -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb85c"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>

    <!-- Display inner gradient -->
    <linearGradient id="displayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10141d"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>

    <!-- Subtle drop shadow filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Body with Shadow -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#bodyGrad)" filter="url(#cardShadow)"/>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3"/>

  <!-- Calculator Display Glass Section -->
  <rect x="80" y="80" width="352" height="110" rx="28" fill="url(#displayGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Subtle previous equation trace -->
  <text x="404" y="122" fill="#687386" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600" text-anchor="end">1,250 × 8</text>
  
  <!-- Crisp high-contrast display value -->
  <text x="404" y="168" fill="#f3f6fb" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="700" letter-spacing="-1" text-anchor="end">10,000</text>

  <!-- Row 1 Buttons (Utility & Operator) -->
  <rect x="80" y="216" width="70" height="52" rx="14" fill="#252d3d"/>
  <text x="115" y="248" fill="#dbe4f0" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">AC</text>

  <rect x="166" y="216" width="70" height="52" rx="14" fill="#252d3d"/>
  <text x="201" y="248" fill="#dbe4f0" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">±</text>

  <rect x="252" y="216" width="70" height="52" rx="14" fill="#252d3d"/>
  <text x="287" y="248" fill="#dbe4f0" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" text-anchor="middle">%</text>

  <rect x="338" y="216" width="94" height="52" rx="14" fill="#1b3648"/>
  <text x="385" y="249" fill="#aee7ff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">÷</text>

  <!-- Row 2 Buttons -->
  <rect x="80" y="280" width="70" height="52" rx="14" fill="#1c2230"/>
  <text x="115" y="313" fill="#f3f6fb" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" text-anchor="middle">7</text>

  <rect x="166" y="280" width="70" height="52" rx="14" fill="#1c2230"/>
  <text x="201" y="313" fill="#f3f6fb" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" text-anchor="middle">8</text>

  <rect x="252" y="280" width="70" height="52" rx="14" fill="#1c2230"/>
  <text x="287" y="313" fill="#f3f6fb" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" text-anchor="middle">9</text>

  <rect x="338" y="280" width="94" height="52" rx="14" fill="#1b3648"/>
  <text x="385" y="313" fill="#aee7ff" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">×</text>

  <!-- Row 3 Buttons -->
  <rect x="80" y="344" width="70" height="52" rx="14" fill="#1c2230"/>
  <text x="115" y="377" fill="#f3f6fb" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" text-anchor="middle">4</text>

  <rect x="166" y="344" width="70" height="52" rx="14" fill="#1c2230"/>
  <text x="201" y="377" fill="#f3f6fb" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" text-anchor="middle">5</text>

  <rect x="252" y="344" width="70" height="52" rx="14" fill="#1c2230"/>
  <text x="287" y="377" fill="#f3f6fb" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" text-anchor="middle">6</text>

  <rect x="338" y="344" width="94" height="52" rx="14" fill="#1b3648"/>
  <text x="385" y="377" fill="#aee7ff" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">−</text>

  <!-- Row 4 Bottom Action Buttons with Hero Glowing Equals -->
  <rect x="80" y="408" width="156" height="52" rx="14" fill="#1c2230"/>
  <text x="158" y="441" fill="#f3f6fb" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600" text-anchor="middle">0</text>

  <rect x="252" y="408" width="70" height="52" rx="14" fill="#1c2230"/>
  <text x="287" y="441" fill="#f3f6fb" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">.</text>

  <!-- Signature Glowing Amber Accent Equals Button -->
  <rect x="338" y="408" width="94" height="52" rx="14" fill="url(#amberGlow)"/>
  <text x="385" y="442" fill="#1f1000" font-family="Segoe UI, sans-serif" font-size="26" font-weight="800" text-anchor="middle">=</text>

  <!-- Floating Pin Badge (Upper Left Corner of Body) showcasing Float/Always-on-top -->
  <circle cx="86" cy="86" r="20" fill="#1f765b" stroke="#7ee0b6" stroke-width="2"/>
  <path d="M80 86h12v-2l-2-2v-5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v5l-2 2v2z" fill="#ffffff"/>
  <line x1="86" y1="86" x2="86" y2="92" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
